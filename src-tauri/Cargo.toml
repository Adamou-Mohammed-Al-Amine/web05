[package]
name = "prayer-bar"
version = "0.1.0"
description = "A minimalist floating prayer-time bar for Windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
window-vibrancy = "0.5"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only for the native rounded-window-region clipping (Windows-only feature).
# windows-sys is pure ABI bindings (no wrapper types), so it carries none of
# the version-matching risk a full `windows` crate dependency would have
# against Tauri's internal one — see vibrancy.rs for why that matters here.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_Foundation"] }

[profile.release]
opt-level = "z"     # optimize for binary size, fits the "lightweight" requirement
lto = true
codegen-units = 1
panic = "abort"
strip = true
