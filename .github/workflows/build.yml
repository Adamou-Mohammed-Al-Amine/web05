name: Build Windows Installer

# Builds a real "Prayer Bar Setup x.x.x.exe" on a genuine Windows machine
# (GitHub's windows-latest runner) with a current Rust toolchain, WebView2,
# and NSIS — none of which are available in a Linux dev sandbox. This is the
# path to a real installable app if you don't want to install the Rust/MSVC
# toolchain on your own PC.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. Go to the "Actions" tab -> "Build Windows Installer" -> "Run workflow"
#      (or just push a commit / tag — see the triggers below).
#   3. When it finishes, download "prayer-bar-windows-installer" from the
#      run's Artifacts section. It contains Prayer Bar Setup <version>.exe.
#
# Tagging a commit like `v1.0.0` also attaches the installer to a GitHub
# Release automatically.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app + NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Attaches the installer to a GitHub Release when the trigger was
          # a version tag; otherwise just builds without publishing.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Prayer Bar {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: prayer-bar-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
