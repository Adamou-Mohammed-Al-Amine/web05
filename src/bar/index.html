<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بار الصلاة</title>
  <link rel="stylesheet" href="./bar.css" />
</head>
<body>
  <!-- data-tauri-drag-region lets the OS handle window dragging natively -->
  <div id="bar" class="bar" data-tauri-drag-region data-tone="normal">
    <div class="bar-noise" aria-hidden="true"></div>

    <!-- المحتوى العادي: نص واحد يترك للمتصفح ترتيب الأرقام/العربية تلقائيًا -->
    <div class="bar-content" id="barContent">
      <span class="bar-text" id="barText">12:12:12&nbsp;&nbsp;المغرب</span>
    </div>

    <!-- إعلان كبير: أذان الصلاة أو منبه مخصص -->
    <div class="bar-announce" id="barAnnounce" hidden>
      <span class="announce-text" id="announceText">حان وقت صلاة المغرب</span>
      <button class="announce-btn" id="btnAcknowledge">حسنًا</button>
    </div>
  </div>

  <script type="module" src="./bar.ts"></script>
</body>
</html>
